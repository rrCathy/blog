name: Deploy blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-blog
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to rrcathy.github.io/blog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure native rolldown binding for linux (npm/cli#4828)
        # 背景:Windows 上生成的 package-lock.json 只实例化 win32 binding 节点,
        # npm ci 不会补装 linux 的 optional native binding,导致 rolldown 加载失败
        # (Cannot find module '@rolldown/binding-wasm32-wasi')。
        #
        # 注意:这里刻意【不用】npm install 来补装。npm install(尤其带
        # --package-lock=false)会忽略 lock、按 package.json 的 ^ 范围重解析整棵树,
        # 于是 react 会被升到最新的 19.3.0,而 @react-three/fiber 的 peer 是
        # "react >=19 <19.3" → ERESOLVE,构建直接挂掉(2026-09-10 踩过)。
        # 改为直接下载对应版本的 tarball 解压到 node_modules:不触发任何依赖解析,
        # 不改动已锁定的版本,完全确定。
        run: |
          set -euo pipefail
          RB="$(node -p "require('./node_modules/rolldown/package.json').version")"
          echo "rolldown version: ${RB}"
          DEST="node_modules/@rolldown/binding-linux-x64-gnu"
          URL="$(npm view "@rolldown/binding-linux-x64-gnu@${RB}" dist.tarball)"
          echo "tarball: ${URL}"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          curl -fsSL "${URL}" -o /tmp/rolldown-binding.tgz
          tar -xzf /tmp/rolldown-binding.tgz -C "${DEST}" --strip-components=1
          ls -la "${DEST}"
          node -e "require('@rolldown/binding-linux-x64-gnu'); console.log('rolldown linux binding loaded OK')"

      - run: npm run build

      - name: Checkout user Pages repo
        uses: actions/checkout@v4
        with:
          repository: rrCathy/rrcathy.github.io
          token: ${{ secrets.PAGES_TOKEN }}
          path: pages-site

      - name: Replace blog/ directory with new build
        run: |
          rm -rf pages-site/blog
          mkdir -p pages-site/blog
          cp -r dist/* pages-site/blog/
          touch pages-site/blog/.nojekyll

      - name: Commit & push to rrcathy.github.io
        run: |
          cd pages-site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "Deploy blog from rrCathy/blog @ ${{ github.sha }}"
          git push
