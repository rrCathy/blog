name: Deploy blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-blog
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to rrcathy.github.io/blog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure native rolldown binding for linux (npm/cli#4828)
        # Windows 上生成的 package-lock.json 只实例化 win32 binding 节点,
        # npm ci/install 都不会补装 linux 的 optional native binding,
        # 导致 rolldown 加载失败(Cannot find module '@rolldown/binding-wasm32-wasi')。
        # 按实际安装的 rolldown 版本显式补装 linux-x64 binding(runner 为 ubuntu x64)。
        run: |
          set -uo pipefail
          echo "node: $(node --version) | npm: $(npm --version) | registry: $(npm config get registry)"
          if [ ! -f node_modules/rolldown/package.json ]; then
            echo "::error title=rolldown-missing::node_modules/rolldown/package.json not found. node_modules top40: $(ls node_modules | head -n 40 | tr '\n' '|')"
            exit 1
          fi
          RB="$(node -p "require('./node_modules/rolldown/package.json').version")"
          echo "rolldown version: ${RB}"
          ok=0
          for i in 1 2 3; do
            if npm install --no-save --no-audit --no-fund --package-lock=false \
                 "@rolldown/binding-linux-x64-gnu@${RB}" > npm-binding.log 2>&1; then
              ok=1; break
            fi
            echo "::warning::attempt ${i} failed"
            sleep 5
          done
          if [ "${ok}" != "1" ]; then
            echo "----- npm log (tail 40) -----"
            tail -n 40 npm-binding.log
            # 把 npm 关键报错冒烟为注解,便于无 admin 权限时通过公开 API 诊断
            A="$(grep -E 'npm (ERR!|error)|ETARGET|ERESOLVE|ENOTFOUND|EAI_AGAIN|403|404' npm-binding.log | head -n 5 | tr '\n' '|' | cut -c1-900)"
            echo "::error title=npm-binding-install-failed::${A}"
            exit 1
          fi
          node -e "require('@rolldown/binding-linux-x64-gnu'); console.log('rolldown linux binding loaded OK')"

      - run: npm run build

      - name: Checkout user Pages repo
        uses: actions/checkout@v4
        with:
          repository: rrCathy/rrcathy.github.io
          token: ${{ secrets.PAGES_TOKEN }}
          path: pages-site

      - name: Replace blog/ directory with new build
        run: |
          rm -rf pages-site/blog
          mkdir -p pages-site/blog
          cp -r dist/* pages-site/blog/
          touch pages-site/blog/.nojekyll

      - name: Commit & push to rrcathy.github.io
        run: |
          cd pages-site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "Deploy blog from rrCathy/blog @ ${{ github.sha }}"
          git push
